version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci --legacy-peer-deps --ignore-scripts

  build:
    commands:
      - echo "Running security checks..."

      # npm audit (high+ severity only)
      - npm audit --audit-level=high || true

      # Check for secrets/credentials in source
      - npm run check:secrets

      # Check security exception annotations
      - npm run check:security-exceptions

      # Check JWT scope boundaries
      - npm run check:jwt-scope

      # TypeScript strict mode verification
      - npm run typecheck

  post_build:
    commands:
      - echo "Security scan complete"

artifacts:
  files:
    - "**/*"
  discard-paths: no
