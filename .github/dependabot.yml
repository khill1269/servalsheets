version: 2

# Grouping strategy
# -----------------
# Dependencies are grouped by *failure domain* rather than by dev/prod, so a
# single PR contains things that need to be reviewed together (and things
# that break together). Key clusters:
#
#   - googleapis          : googleapis + google-auth-library move as a unit —
#                           auth-library bumps often require googleapis bumps
#   - opentelemetry       : @opentelemetry/* MUST move together; api/sdk drift
#                           produces runtime "unknown instrumentation" errors
#   - mcp-sdk             : @modelcontextprotocol/sdk is intentionally NOT
#                           grouped — every bump is semantically load-bearing
#                           and needs its own review
#   - express-stack       : express + middleware + types move together
#   - testing             : vitest + @vitest/* + @stryker-mutator/* + fast-check
#   - linting             : eslint + @typescript-eslint/* + prettier
#   - stripe              : stripe + @types/stripe
#   - types               : remaining @types/* catch-all
#   - misc                : long tail (anything not matched above)
#
# Major bumps are ignored for load-bearing runtime deps (mcp-sdk, typescript,
# vitest, eslint) so they get an explicit human-initiated PR. Within testing
# and linting *groups*, majors are allowed because tooling majors tend to be
# mechanically upgradeable.

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/serval-core'
      - '/tools/google-docs-server'
      - '/tools/gcloud-console-server'
      - '/tools/test-intelligence-server'
      - '/src/ui/tracing-dashboard'
      - '/k8s/operator'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    # Lowered from 10 → 6 to force topical grouping rather than per-package PRs.
    open-pull-requests-limit: 6
    labels:
      - 'dependencies'
      - 'automated'

    groups:
      # Google API surface — auth-library bumps often require googleapis bumps
      googleapis:
        patterns:
          - 'googleapis'
          - 'google-auth-library'
        update-types:
          - 'minor'
          - 'patch'

      # OpenTelemetry — api/sdk version drift breaks instrumentation at runtime
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
        update-types:
          - 'minor'
          - 'patch'

      # Express + its middleware + types (breaks are almost always in
      # the whole stack together)
      express-stack:
        patterns:
          - 'express'
          - 'express-rate-limit'
          - 'compression'
          - 'cors'
          - 'helmet'
          - 'swagger-ui-express'
          - '@types/express'
          - '@types/compression'
          - '@types/cors'
          - '@types/swagger-ui-express'
        update-types:
          - 'minor'
          - 'patch'

      # Payments
      stripe:
        patterns:
          - 'stripe'
          - '@types/stripe'
        update-types:
          - 'minor'
          - 'patch'

      # Test stack (vitest + mutation-testing + property-based + supertest).
      # Majors are allowed here — tooling majors are usually mechanical.
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@stryker-mutator/*'
          - 'fast-check'
          - 'supertest'
          - '@types/supertest'
        update-types:
          - 'minor'
          - 'patch'
          - 'major'

      # Lint + format. Majors allowed — eslint configs are the pain, and
      # we'd rather get one flat-config PR than five back-to-back minors.
      linting:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier'
        update-types:
          - 'minor'
          - 'patch'
          - 'major'

      # Zod + JSON-schema ecosystem (schemas are a shared surface; majors
      # hand-rolled only)
      zod-ecosystem:
        patterns:
          - 'zod'
          - 'zod-to-json-schema'
          - 'ajv'
          - 'ajv-formats'
        update-types:
          - 'minor'
          - 'patch'

      # Remaining @types/* catch-all (keeps type bumps out of the misc
      # bucket below)
      types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'

      # Long tail — everything not otherwise grouped. This is the
      # fall-through bucket; keep it narrow so it doesn't balloon.
      misc:
        patterns:
          - '*'
        exclude-patterns:
          - 'googleapis'
          - 'google-auth-library'
          - '@opentelemetry/*'
          - '@modelcontextprotocol/sdk'
          - 'express'
          - 'express-rate-limit'
          - 'compression'
          - 'cors'
          - 'helmet'
          - 'swagger-ui-express'
          - 'stripe'
          - 'vitest'
          - '@vitest/*'
          - '@stryker-mutator/*'
          - 'fast-check'
          - 'supertest'
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'zod'
          - 'zod-to-json-schema'
          - 'ajv'
          - 'ajv-formats'
          - '@types/*'
          - 'typescript'
          - 'tsx'
        update-types:
          - 'minor'
          - 'patch'

    # Load-bearing deps: majors are ignored here so they get an explicit,
    # human-initiated upgrade PR rather than being swept into a batch.
    ignore:
      - dependency-name: '@modelcontextprotocol/sdk'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # NB: vitest/eslint majors are *allowed inside their group* (see above)
      # but ignored as ungrouped singletons — this prevents a solo vitest@5
      # PR landing outside the testing group and missing the co-upgrade.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  # ---------------------------------------------------------------------------
  # GitHub Actions — always grouped; action bumps are almost always safe
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
          - 'major'

  # ---------------------------------------------------------------------------
  # Docker base images
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/deployment/demo'
      - '/deployment/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'docker'
      - 'automated'
    groups:
      docker-base-images:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
