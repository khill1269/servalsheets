name: Mutation Testing

on:
  # Manual trigger for full run or specific configs
  workflow_dispatch:
    inputs:
      config:
        description: 'Stryker config to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          - minimal
          - full

permissions:
  contents: read
  issues: write

# Only one mutation run at a time — they're expensive
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  mutation-critical:
    name: Mutation Tests (critical paths)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run when manually dispatched (the only trigger for this workflow)
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run critical-path mutation tests
        run: |
          CONFIG="${{ github.event.inputs.config || 'critical' }}"
          if [ "$CONFIG" = "full" ]; then
            npm run test:mutation
          elif [ "$CONFIG" = "minimal" ]; then
            npm run test:mutation:minimal
          else
            npm run test:mutation:critical
          fi
        env:
          # Increase heap for Stryker's parallel workers
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: mutation-report-${{ github.sha }}
          path: |
            reports/mutation/
            .stryker-tmp/
          retention-days: 14
          if-no-files-found: ignore

