# Deploy VitePress Documentation to GitHub Pages
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: deploy-dashboard.yml also deploys to GitHub Pages. Each deployment
# replaces the entire site, so the two workflows should eventually be merged.
# See deploy-dashboard.yml for details.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `--if-present` makes this a no-op when `docs:site` isn't defined in
      # package.json yet (the script is added by an in-flight branch). The
      # `built` output below tells downstream steps whether artifacts exist.
      - name: Build docs
        id: build
        run: |
          npm run docs:site --if-present
          if [ -d docs/.vitepress/dist ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::docs:site script not defined or produced no output; skipping deploy."
          fi

      - name: Check GitHub Pages availability
        if: steps.build.outputs.built == 'true'
        id: check-pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.warning('GitHub Pages is not enabled for this repository; skipping deployment steps.');
                core.setOutput('enabled', 'false');
                return;
              }
              throw error;
            }

      - name: Setup Pages
        if: steps.build.outputs.built == 'true' && steps.check-pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.build.outputs.built == 'true' && steps.check-pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

      - name: Summarize skipped deployment
        if: steps.build.outputs.built != 'true' || steps.check-pages.outputs.enabled != 'true'
        run: |
          echo "## Deploy Docs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.built }}" != "true" ]; then
            echo "- Docs site build was skipped (docs:site script not defined yet)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Docs site build completed." >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Pages is not enabled for this repository, so deployment was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.build.outputs.built == 'true' && needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
