name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Dependency Review
        id: dependency_review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        continue-on-error: true
        with:
          fail-on-severity: moderate

      - name: Report unsupported dependency review
        if: steps.dependency_review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review is informational in this repository and is not currently supported for all PR contexts."

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check security exception review dates
        id: security_exceptions
        run: npm run check:security-exceptions

      - name: Run npm audit (fail on high/critical — allowlist in SECURITY_EXCEPTIONS.md)
        # Uses a custom wrapper (scripts/audit-with-exceptions.mjs) that reads SECURITY_EXCEPTIONS.md
        # to allowlist known-unfixable GHSAs. Any NEW CVE not listed there will still fail CI.
        # The npm --allow-ghsas flag is unreliable in npm 10.9.x — use the wrapper instead.
        run: node scripts/audit-with-exceptions.mjs --audit-level=high

      - name: Run npm audit (warn on moderate)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate audit report
        if: always()
        run: |
          npm audit --json > npm-audit-report.json || true

      - name: Open issue for overdue security exception review
        if: github.event_name == 'schedule' && failure() && steps.security_exceptions.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Security exception review overdue';
            const body = [
              'The scheduled security workflow detected an overdue entry in `SECURITY_EXCEPTIONS.md`.',
              '',
              'Run `npm run check:security-exceptions` locally and either update the exception, resolve it, or remove the waiver.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              core.info(`Issue already open: #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `--ignore-npm-errors` tolerates the `npm ls` warning that vitepress
      # 1.6.4 pins vite ^5 while the top-level dep declares vite ^7. Without
      # it, cyclonedx-npm exits 254 on an otherwise-valid tree.
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Determine TruffleHog scan range
        id: trufflehog-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "${{ github.sha }}" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog OSS (diff scan)
        if: steps.trufflehog-range.outputs.mode == 'diff'
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ steps.trufflehog-range.outputs.base }}
          head: ${{ steps.trufflehog-range.outputs.head }}
          extra_args: --debug --only-verified

      - name: TruffleHog OSS (full scan)
        if: steps.trufflehog-range.outputs.mode == 'full'
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          extra_args: --debug --only-verified

  security-summary:
    name: Security Scanning Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [dependency-review, codeql, npm-audit, sbom, secret-scanning]

    steps:
      - name: Verify required security jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const allowedSkipped = new Set(['dependency-review']);
          const failures = [];

          for (const [job, result] of Object.entries(needs)) {
            if (result.result === 'success') continue;
            if (result.result === 'skipped' && allowedSkipped.has(job)) continue;
            failures.push(`${job}=${result.result}`);
          }

          if (failures.length > 0) {
            console.error(`Required security jobs failed: ${failures.join(', ')}`);
            process.exit(1);
          }

          console.log('All required security jobs passed.');
          EOF
