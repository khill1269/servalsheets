name: Setup Node (Reusable)

# Reusable workflow for Node.js setup + npm ci + caching.
# Eliminates the 31 redundant setup-node + npm ci blocks across all workflows.
#
# Usage:
#   jobs:
#     my-job:
#       uses: ./.github/workflows/setup-node-cached.yml
#       with:
#         node-version: '22'         # optional, defaults to 22
#         build: true                # optional, runs npm run build after install
#         upload-dist: true          # optional, uploads dist/ as artifact

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
        required: false
      build:
        type: boolean
        default: false
        required: false
      upload-dist:
        type: boolean
        default: false
        required: false
      dist-artifact-name:
        type: string
        default: 'dist-build'
        required: false
    outputs:
      cache-hit:
        description: Whether npm cache was hit
        value: ${{ jobs.setup.outputs.cache-hit }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.npm-cache.outputs.cache-hit }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        id: npm-cache
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Restore Turbo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .turbo
            .tsbuildinfo
            .eslintcache
          key: ${{ runner.os }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Install dependencies
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build
        if: inputs.build
        run: npm run build

      - name: Upload dist artifact
        if: inputs.upload-dist && inputs.build
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: ${{ inputs.dist-artifact-name }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
