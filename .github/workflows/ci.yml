name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'deployment/**'
      - '*.example.*'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'deployment/**'
      - '*.example.*'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Fast checks — Node 22 (Node 20 compat tested in the test-fast matrix)
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Diagnostics
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Disk: $(df -h . | tail -1)"
          echo "RAM: $(free -m | awk '/Mem:/{print $2"M total, "$7"M free"}')"
          echo "Packages: $(ls node_modules | wc -l) directories"

      - name: Setup Turbo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache TypeScript build info
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .tsbuildinfo
            .tsbuildinfo.build
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('src/**/*.ts', 'tsconfig*.json') }}

      - name: Cache dist folder
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles('src/**/*.ts', 'tsconfig*.json', 'package-lock.json') }}

      - name: Cache ESLint results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('src/**/*.ts', '.eslintrc*', 'eslint.config.*') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Check hardcoded secrets (security — run before any npm scripts)
        run: npm run check:secrets

      - name: Validate action metadata consistency
        run: npm run validate:actions

      - name: Build workspace packages
        timeout-minutes: 3
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Clear stale build artifacts
        run: rm -f .tsbuildinfo .tsbuildinfo.build && rm -rf dist

      - name: Emit dist/ (noCheck — type errors gate at the typecheck step below)
        timeout-minutes: 5
        run: NODE_OPTIONS="--max-old-space-size=4096" ./node_modules/.bin/tsc -p tsconfig.docker.json

      - name: Copy runtime assets to dist/
        run: node scripts/copy-runtime-assets.mjs

      - name: Check packages/mcp-http dist parity
        run: npm run check:source-dist

      - name: Generate metadata
        run: npm run generate:metadata

      - name: Verify documentation matches code
        run: |
          # Import actual counts from source of truth
          EXPECTED_TOOLS=$(node --input-type=module -e "import { TOOL_COUNT } from './dist/schemas/index.js'; console.log(TOOL_COUNT)")
          EXPECTED_ACTIONS=$(node --input-type=module -e "import { ACTION_COUNT } from './dist/schemas/index.js'; console.log(ACTION_COUNT)")

          echo "Source of truth: ${EXPECTED_TOOLS} tools, ${EXPECTED_ACTIONS} actions"

          # Check README.md mentions correct count
          if ! grep -q "${EXPECTED_TOOLS} tools, ${EXPECTED_ACTIONS} actions" README.md; then
            echo "❌ README.md has incorrect action count"
            echo "   Expected: ${EXPECTED_TOOLS} tools, ${EXPECTED_ACTIONS} actions"
            echo "   Current: $(grep -o '[0-9]* tools, [0-9]* actions' README.md || echo 'not found')"
            exit 1
          fi

          # Check SKILL.md mentions correct count
          if ! grep -q "${EXPECTED_TOOLS} tools with ${EXPECTED_ACTIONS} actions" docs/guides/SKILL.md; then
            echo "❌ SKILL.md has incorrect action count"
            echo "   Expected: ${EXPECTED_TOOLS} tools with ${EXPECTED_ACTIONS} actions"
            echo "   Current: $(grep -o '[0-9]* tools with [0-9]* actions' docs/guides/SKILL.md || echo 'not found')"
            exit 1
          fi

          echo "✅ Documentation action counts are correct (${EXPECTED_TOOLS} tools, ${EXPECTED_ACTIONS} actions)"

      - name: Validate metadata consistency (strict mode)
        run: npm run check:metadata-strict

      - name: Validate Zod schema markers
        run: npm run check:zod-markers

      - name: Validate cross-map completeness
        run: npx vitest run tests/contracts/cross-map-consistency.test.ts

      - name: Check for hardcoded count references
        run: bash scripts/check-hardcoded-counts.sh

      - name: Verify docs/agents match source action count (no stale 409 references)
        run: |
          ACTUAL=$(node -e "const {ACTION_COUNT}=require('./dist/schemas/index.js'); process.stdout.write(String(ACTION_COUNT))")
          STALE=$(grep -rn "409 actions\|409-action\|409\/409\|all 409\b\|: 409\b" README.md CLAUDE.md .claude/agents/ 2>/dev/null | wc -l | tr -d ' ')
          if [ "$STALE" -gt "0" ]; then
            echo "❌ Found $STALE stale '409 actions' references (source says $ACTUAL):"
            grep -rn "409 actions\|409-action\|409\/409\|all 409\b\|: 409\b" README.md CLAUDE.md .claude/agents/ 2>/dev/null
            exit 1
          fi
          echo "✅ Docs action count consistent with source ($ACTUAL actions)"

      - name: Validate exact tool count
        run: |
          node --input-type=module -e "
          import { TOOL_DEFINITIONS } from './dist/mcp/registration/tool-definitions.js';
          import { TOOL_COUNT } from './dist/schemas/index.js';

          if (TOOL_DEFINITIONS.length !== TOOL_COUNT) {
            console.error(\`❌ TOOL_DEFINITIONS length (\${TOOL_DEFINITIONS.length}) !== TOOL_COUNT (\${TOOL_COUNT})\`);
            process.exit(1);
          }

          console.log(\`✅ Tool count validated: \${TOOL_COUNT} tools\`);
          "

      - name: Check placeholders
        run: npm run check:placeholders

      - name: Check metadata drift
        run: npm run check:drift
        timeout-minutes: 2

      - name: Type check
        run: npm run typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Lint (with cache)
        run: npm run lint -- --cache --cache-location .eslintcache
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Check architecture
        run: npm run check:architecture

      - name: Check integration wiring
        run: npm run check:integration-wiring

      - name: Check test determinism (no Math.random/Date.now in core tests)
        run: npm run check:test-determinism --if-present

      - name: Check tautological assertions
        run: npm run check:tautologies --if-present

      - name: Format check
        run: npm run format:check

      - name: Check JWT scope (security - no jwt.sign outside auth/)
        run: npm run check:jwt-scope

      - name: MCP protocol smoke test (no credentials required)
        run: node scripts/mcp-protocol-smoke.mjs --fail-fast
        timeout-minutes: 3

      - name: MCP protocol smoke test (flat tool mode)
        run: SERVAL_TOOL_MODE=flat node scripts/mcp-protocol-smoke.mjs --fail-fast
        timeout-minutes: 3

      - name: Audit gate (A1-A14, skip mutation)
        run: SKIP_MUTATION_TESTING=true npm run audit:gate
        timeout-minutes: 8

      - name: Upload dist artifact for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

      - name: Generate CI summary
        if: always()
        run: |
          echo "## Quick Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript**: $(npx tsc --version)" >> $GITHUB_STEP_SUMMARY
          TOOLS=$(node --input-type=module -e "import { TOOL_COUNT } from './dist/schemas/index.js'; console.log(TOOL_COUNT)" 2>/dev/null || echo '?')
          ACTIONS=$(node --input-type=module -e "import { ACTION_COUNT } from './dist/schemas/index.js'; console.log(ACTION_COUNT)" 2>/dev/null || echo '?')
          echo "- **Tools/Actions**: ${TOOLS} tools, ${ACTIONS} actions" >> $GITHUB_STEP_SUMMARY

  # Fast unit tests with Vitest sharding
  test-fast:
    name: Fast Tests (Node ${{ matrix.node-version }}, Shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Restore dependencies cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            .turbo
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Generate metadata (produces manifest.json, server.json needed by contract tests)
        run: npm run generate:metadata

      - name: Run fast tests with retry (shard ${{ matrix.shard }}/4)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          retry_wait_seconds: 10
          command: npm run test:fast -- --shard=${{ matrix.shard }}/4

  simulation-tests:
    name: Simulation Tests
    runs-on: ubuntu-latest
    needs: test-fast
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Generate metadata
        run: npm run generate:metadata

      - name: Run simulation tests
        id: sim_tests
        run: |
          npm run test:simulation -- --reporter=verbose 2>&1 | tee sim-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          PASS=$(grep -c ' ✓ ' sim-output.txt 2>/dev/null || true)
          FAIL=$(grep -c ' ✗ \| × ' sim-output.txt 2>/dev/null || true)
          PASS=${PASS:-0}
          FAIL=${FAIL:-0}
          echo "pass_count=$PASS" >> $GITHUB_OUTPUT
          echo "fail_count=$FAIL" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Run chaos resilience tests
        id: chaos_tests
        run: |
          npm run test:chaos -- --reporter=verbose 2>&1 | tee chaos-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          CHAOS_PASS=$(grep -c ' ✓ ' chaos-output.txt 2>/dev/null || echo 0)
          CHAOS_FAIL=$(grep -c ' ✗ \| × ' chaos-output.txt 2>/dev/null || echo 0)
          echo "chaos_pass=$CHAOS_PASS" >> $GITHUB_OUTPUT
          echo "chaos_fail=$CHAOS_FAIL" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Report simulation + chaos results
        if: always()
        run: |
          echo "## Simulation Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Simulation Passed:** ${{ steps.sim_tests.outputs.pass_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Simulation Failed:** ${{ steps.sim_tests.outputs.fail_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chaos Passed:** ${{ steps.chaos_tests.outputs.chaos_pass }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chaos Failed:** ${{ steps.chaos_tests.outputs.chaos_fail }}" >> $GITHUB_STEP_SUMMARY

  snapshot-tests:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Generate metadata (produces manifest.json, server.json needed by snapshot tests)
        run: npm run generate:metadata

      - name: Run snapshot regression suite
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 8
          max_attempts: 2
          retry_wait_seconds: 10
          command: npm run test:snapshots

  # Parallel test execution with sharding (slower integration tests)
  test-integration:
    name: Integration Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            .turbo
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Setup Turbo cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-${{ matrix.shard }}-
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Run integration tests with retry (shard ${{ matrix.shard }}/${{ matrix.total_shards }})
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: npm run test:integration -- --shard=${{ matrix.shard }}/${{ matrix.total_shards }}

  mcp-http-task-contract:
    name: MCP HTTP Task Contract
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Run MCP HTTP task contract checks
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 15
          command: npm run test:mcp-http-task-contract

  http-transport-failover:
    name: HTTP Transport Failover
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Run HTTP transport failover regression
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 15
          command: npm run test:http-transport-failover

  validate-server-json:
    name: Validate server.json
    runs-on: ubuntu-latest
    needs: quick-checks
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages (needed for @serval/core import in extended validation)
        run: |
          npm run build -w packages/serval-core
          npm run build -w packages/mcp-runtime
          npm run build -w packages/mcp-stdio
          npm run build -w packages/mcp-http
          npm run build -w packages/mcp-client

      - name: Generate metadata (produces manifest.json, server.json needed by validators)
        run: npm run generate:metadata

      - name: Validate server.json
        run: npm run validate:server-json

      - name: Validate server.json (extended)
        run: npm run validate:server-json-extended

  # Build after all tests pass
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      [
        test-fast,
        snapshot-tests,
        test-integration,
        mcp-http-task-contract,
        http-transport-failover,
        validate-server-json,
      ]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download dist from quick-checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-build
          path: dist

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Rebuild dist (incremental — dist already seeded)
        run: NODE_OPTIONS="--max-old-space-size=4096" ./node_modules/.bin/tsc -p tsconfig.docker.json

      - name: Smoke test built artifacts
        run: npm run smoke

      - name: Check package can be packed
        run: npm pack --dry-run

  mutation-testing:
    name: Mutation Testing (Critical Paths)
    # Only run on main/release pushes to save runner minutes (~60 min per run with concurrency=2)
    if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-latest
    needs: [test-fast]
    # Run 24769965358 timed out at 45 min after testing 786/2166 mutants at
    # concurrency=1. Bumped Stryker concurrency to 2 (halves wall time) and
    # raised CI timeout to 90 min for safety margin on slower runners.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages (needed for @serval/core imports in mutation targets)
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Run critical-path regression suite
        run: >
          npx vitest run
          tests/contracts/oauth-refresh-errors.test.ts
          tests/contracts/mutation-action-consistency.test.ts
          tests/middleware/mutation-safety-middleware.test.ts
          tests/middleware/write-lock-middleware.test.ts
          tests/services/python-worker.test.ts
          tests/services/duckdb-worker.test.ts
          tests/utils/retry.test.ts
          tests/utils/circuit-breaker-states.test.ts
          tests/utils/circuit-breaker-fallback.test.ts
          tests/unit/circuit-breaker-fallback.test.ts

      - name: Run mutation tests on critical paths
        id: mutation_critical
        run: npx stryker run stryker.critical.conf.mjs

  coverage:
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && (
        github.ref_name == 'main' ||
        startsWith(github.ref_name, 'release/') ||
        startsWith(github.ref_name, 'feat/') ||
        startsWith(github.ref_name, 'fix/')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build -w packages/serval-core -w packages/mcp-client -w packages/mcp-http -w packages/mcp-runtime -w packages/mcp-stdio

      - name: Build main project
        run: npm run build

      - name: Generate metadata (produces manifest.json, server.json needed by coverage suite)
        run: npm run generate:metadata

      - name: Run coverage tracking suite
        run: npm run test:coverage:tracking
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Generate coverage summary
        id: coverage
        run: |
          # Extract coverage percentages
          STATEMENTS=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
          BRANCHES=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')
          LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')

          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "lines=$LINES" >> $GITHUB_OUTPUT

          # Create badge color based on coverage
          if (( $(echo "$LINES >= 80" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$LINES >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-servalsheets
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));

            const total = coverage.total;
            const statements = total.statements.pct.toFixed(2);
            const branches = total.branches.pct.toFixed(2);
            const functions = total.functions.pct.toFixed(2);
            const lines = total.lines.pct.toFixed(2);

            const comment = `## 📊 Coverage Report

            | Metric | Coverage | Change |
            |--------|----------|--------|
            | **Statements** | ${statements}% | - |
            | **Branches** | ${branches}% | - |
            | **Functions** | ${functions}% | - |
            | **Lines** | ${lines}% | - |

            <details>
            <summary>📁 Coverage by File</summary>

            Full coverage report available in [artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            </details>

            ---
            *🤖 Generated by [Coverage Action](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Report coverage against repo thresholds
        run: |
          STATEMENTS=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
          BRANCHES=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')
          LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')

          echo "Coverage Summary:"
          echo "  Statements: $STATEMENTS%"
          echo "  Branches: $BRANCHES%"
          echo "  Functions: $FUNCTIONS%"
          echo "  Lines: $LINES%"

          # Current thresholds match actual coverage baseline (lines ~62%, branches ~50%).
          # Raise these incrementally as coverage improves.
          FAILED=0
          if (( $(echo "$LINES < 50" | bc -l) )); then
            echo "::error::Line coverage ($LINES%) is below repository threshold (50%)"
            FAILED=1
          fi

          if (( $(echo "$BRANCHES < 30" | bc -l) )); then
            echo "::error::Branch coverage ($BRANCHES%) is below repository threshold (30%)"
            FAILED=1
          fi

          if (( $(echo "$FUNCTIONS < 50" | bc -l) )); then
            echo "::error::Function coverage ($FUNCTIONS%) is below repository threshold (50%)"
            FAILED=1
          fi

          if (( $(echo "$STATEMENTS < 50" | bc -l) )); then
            echo "::error::Statement coverage ($STATEMENTS%) is below repository threshold (50%)"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "Coverage thresholds not met — failing build."
            exit 1
          fi

      - name: Report status
        run: |
          echo "✅ Coverage tracking report generated successfully"
          echo ""
          echo "Coverage: ${{ steps.coverage.outputs.lines }}%"
          echo "Status: ${{ steps.coverage.outputs.color }}"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check security exception review dates
        run: npm run check:security-exceptions

      - name: Run security audit (fail on high/critical)
        # Uses custom wrapper that reads SECURITY_EXCEPTIONS.md to allowlist known-unfixable GHSAs.
        # Any NEW high/critical CVE not listed in SECURITY_EXCEPTIONS.md will still fail CI.
        # npm --allow-ghsas is unreliable in npm 10.9.x — use the wrapper instead.
        run: node scripts/audit-with-exceptions.mjs --audit-level=high

      - name: Run security audit (warn on moderate)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - quick-checks
      - test-fast
      - snapshot-tests
      - test-integration
      - mcp-http-task-contract
      - http-transport-failover
      - validate-server-json
      - build
      - mutation-testing
      - coverage
      - security

    steps:
      - name: Verify required CI jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          // Jobs that may be skipped without failing CI
          const allowedSkipped = new Set(['mutation-testing', 'security']);
          // Jobs whose failure or cancellation does NOT fail CI (e.g. mutation-testing
          // is informational; a long-running mutant pass that times out should not
          // block merges since the dry-run + critical regression suite already gate
          // correctness in test-fast).
          const optionalNonSuccess = new Set(['mutation-testing']);
          // Jobs that MUST succeed (never allowed to skip)
          const requiredJobs = new Set([
            'quick-checks', 'test-fast', 'snapshot-tests',
            'test-integration', 'mcp-http-task-contract',
            'http-transport-failover', 'validate-server-json', 'build',
            'coverage'
          ]);
          const failures = [];

          for (const [job, result] of Object.entries(needs)) {
            if (result.result === 'success') continue;
            if (result.result === 'skipped' && requiredJobs.has(job)) {
              failures.push(`${job}=skipped (REQUIRED job must not skip)`);
              continue;
            }
            if (result.result === 'skipped' && allowedSkipped.has(job)) continue;
            // Tolerate failure OR cancellation (e.g. job timeout) for optional jobs.
            if ((result.result === 'failure' || result.result === 'cancelled') &&
                optionalNonSuccess.has(job)) continue;
            failures.push(`${job}=${result.result}`);
          }

          // Generate step summary
          const lines = ['## CI Gate Results\n'];
          for (const [job, result] of Object.entries(needs)) {
            const icon = result.result === 'success' ? '✅' :
                         result.result === 'skipped' ? '⏭️' :
                         result.result === 'failure' ? '❌' : '⚠️';
            lines.push(`- ${icon} **${job}**: ${result.result}`);
          }
          const fs = await import('node:fs');
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;
          if (summaryFile) fs.appendFileSync(summaryFile, lines.join('\n') + '\n');

          if (failures.length > 0) {
            console.error(`Required CI jobs failed: ${failures.join(', ')}`);
            process.exit(1);
          }

          console.log('All required CI jobs passed.');
          EOF

  ci-test-summary:
    name: CI Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: always()
    needs:
      - ci-required
      - test-fast
      - simulation-tests
      - snapshot-tests
      - test-integration
      - coverage

    steps:
      - name: Post consolidated test summary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const needs = ${{ toJSON(needs) }};

            const jobs = [
              { name: 'Unit + Contracts',  job: 'test-fast' },
              { name: 'Simulation + Chaos', job: 'simulation-tests' },
              { name: 'Snapshots',          job: 'snapshot-tests' },
              { name: 'Integration',        job: 'test-integration' },
              { name: 'Coverage',           job: 'coverage' },
              { name: 'CI Gate',            job: 'ci-required' },
            ];

            const icon = (result) =>
              result === 'success' ? '✅' :
              result === 'skipped' ? '⏭️' :
              result === 'cancelled' ? '⛔' : '❌';

            const rows = jobs.map(({ name, job }) => {
              const r = needs[job]?.result ?? 'unknown';
              return `| ${icon(r)} **${name}** | ${r} |`;
            });

            const summary = [
              '## 🧪 CI Test Suite Summary',
              '',
              '| Suite | Result |',
              '|-------|--------|',
              ...rows,
              '',
              `_Generated at ${new Date().toUTCString()}_`,
            ].join('\n');

            const fs = await import('node:fs');
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            }
            core.info(summary);
