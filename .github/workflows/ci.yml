name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check for hardcoded secrets
        run: npm run check:secrets
      - name: TypeScript check
        run: npm run typecheck

  fast-tests:
    name: Fast Tests (Unit + Contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run fast tests
        run: npm run test:fast

  snapshot-tests:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run snapshot tests
        run: npm run test:snapshots

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Verify build output
        run: |
          test -f dist/server.js || (echo "dist/server.js not found" && exit 1)
          test -f dist/server.d.ts || (echo "dist/server.d.ts not found" && exit 1)

  metadata-validation:
    name: Metadata Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check metadata drift
        run: npm run check:drift
      - name: Validate actions
        run: npm run validate:actions
      - name: Check server.json
        run: npm run validate:server-json
      - name: Check Zod markers
        run: npm run check:zod-markers
      - name: Check metadata strictness
        run: npm run check:metadata-strict

  architecture-check:
    name: Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check architecture constraints
        run: npm run check:architecture
      - name: Check integration wiring
        run: npm run check:integration-wiring
      - name: Check JWT scope
        run: npm run check:jwt-scope

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check security exceptions
        run: npm run check:security-exceptions
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Run ESLint
        run: npm run lint -- --cache

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quick-checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests
        run: npm run test:mutation

  test-mcp-http:
    name: MCP HTTP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run MCP HTTP tests
        run: npm run test:mcp-http-task-contract

  test-http-failover:
    name: HTTP Transport Failover Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quick-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run HTTP failover tests
        run: npm run test:http-transport-failover

  coverage:
    name: Coverage Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fast-tests, snapshot-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run coverage tests
        run: npm run test:coverage:tracking

  gate-final:
    name: Final Gate (All Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quick-checks
      - fast-tests
      - snapshot-tests
      - integration-tests
      - build
      - metadata-validation
      - architecture-check
      - security
      - lint
      - test-mcp-http
      - test-http-failover
      - coverage
    if: always()
    steps:
      - name: Collect job results
        id: results
        run: |
          echo "quick-checks: ${{ needs.quick-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "fast-tests: ${{ needs.fast-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "snapshot-tests: ${{ needs.snapshot-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "integration-tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "metadata-validation: ${{ needs.metadata-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "architecture-check: ${{ needs.architecture-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "test-mcp-http: ${{ needs.test-mcp-http.result }}" >> $GITHUB_STEP_SUMMARY
          echo "test-http-failover: ${{ needs.test-http-failover.result }}" >> $GITHUB_STEP_SUMMARY
          echo "coverage: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
      - name: CI Gate Summary
        run: |
          echo "# CI Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Checks | $([[ '${{ needs.quick-checks.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.quick-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fast Tests | $([[ '${{ needs.fast-tests.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.fast-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snapshot Tests | $([[ '${{ needs.snapshot-tests.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.snapshot-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | $([[ '${{ needs.integration-tests.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $([[ '${{ needs.build.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata Validation | $([[ '${{ needs.metadata-validation.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.metadata-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture Check | $([[ '${{ needs.architecture-check.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.architecture-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | $([[ '${{ needs.security.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $([[ '${{ needs.lint.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP HTTP Tests | $([[ '${{ needs.test-mcp-http.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.test-mcp-http.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Failover | $([[ '${{ needs.test-http-failover.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.test-http-failover.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $([[ '${{ needs.coverage.result }}' == 'success' ]] && echo '✅' || echo '❌') ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
      - name: Check all checks passed
        run: |
          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.fast-tests.result }}" != "success" ] || \
             [ "${{ needs.snapshot-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.metadata-validation.result }}" != "success" ] || \
             [ "${{ needs.architecture-check.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test-mcp-http.result }}" != "success" ] || \
             [ "${{ needs.test-http-failover.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
