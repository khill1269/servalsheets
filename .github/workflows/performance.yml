name: Performance

# Consolidated from benchmark.yml + performance-tracking.yml.
# Two concerns in one file:
#   1. Micro-benchmark regression tests — run always on main push + PRs (no secrets needed)
#   2. Live API tool benchmarks — conditional on GOOGLE_TEST_CREDENTIALS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark type to run'
        required: true
        default: 'tool-level'
        type: choice
        options:
          - tool-level
          - action-level
          - optimizations
          - full
      include_live_tests:
        description: 'Include live API tests'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false  # never cancel in-flight perf runs

env:
  NODE_VERSION: '20'

jobs:
  # ── Micro-benchmark regression (no secrets, runs on PRs + main) ──────────────
  performance-regression-tests:
    name: Performance Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Need full history for baseline comparison

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Restore performance baseline
        id: cache-baseline
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .performance-history/
          key: performance-baseline-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            performance-baseline-${{ github.ref_name }}-
            performance-baseline-main-

      - name: Run performance regression tests
        run: npm run perf:compare
        env:
          NODE_OPTIONS: '--expose-gc'

      - name: Store performance baseline
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PERF_BASELINE=true npm run perf:baseline

      - name: Generate performance dashboard
        if: always()
        run: |
          if [ -d .performance-history/history ] && ls .performance-history/history/*.json >/dev/null 2>&1; then
            npm run perf:dashboard
          else
            mkdir -p .performance-history
            cat > .performance-history/dashboard.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Performance Dashboard Pending</title>
          </head>
          <body>
            <h1>Performance Dashboard Pending</h1>
            <p>No performance history exists yet for this branch.</p>
          </body>
          </html>
          EOF
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results
          path: |
            .performance-history/
          retention-days: 90

      - name: Upload performance dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-dashboard
          path: .performance-history/dashboard.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment on PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const historyDir = '.performance-history/history';
            if (!fs.existsSync(historyDir)) {
              console.log('No performance history found');
              return;
            }

            const files = fs.readdirSync(historyDir)
              .filter(f => f.startsWith('baseline-') && f.endsWith('.json'))
              .sort()
              .reverse();

            if (files.length === 0) {
              console.log('No baseline files found');
              return;
            }

            const latest = JSON.parse(fs.readFileSync(path.join(historyDir, files[0]), 'utf-8'));

            let comment = '## Performance Impact\n\n';
            comment += `**Commit:** ${latest.gitCommit}\n`;
            comment += `**Tests Run:** ${latest.metrics.length}\n\n`;

            if (files.length >= 2) {
              const previous = JSON.parse(fs.readFileSync(path.join(historyDir, files[1]), 'utf-8'));
              const regressions = [];
              const improvements = [];

              for (const metric of latest.metrics) {
                const prevMetric = previous.metrics.find(m => m.name === metric.name);
                if (!prevMetric) continue;

                const p95Change = ((metric.latency.p95 - prevMetric.latency.p95) / prevMetric.latency.p95) * 100;

                if (p95Change > 15) {
                  regressions.push({ name: metric.name, change: p95Change });
                } else if (p95Change < -10) {
                  improvements.push({ name: metric.name, change: p95Change });
                }
              }

              if (regressions.length > 0) {
                comment += '### ⚠️ Performance Regressions\n\n';
                for (const reg of regressions) {
                  comment += `- \`${reg.name}\`: +${reg.change.toFixed(1)}% slower\n`;
                }
                comment += '\n';
              }

              if (improvements.length > 0) {
                comment += '### ✨ Performance Improvements\n\n';
                for (const imp of improvements) {
                  comment += `- \`${imp.name}\`: ${Math.abs(imp.change).toFixed(1)}% faster\n`;
                }
                comment += '\n';
              }

              if (regressions.length === 0 && improvements.length === 0) {
                comment += '### ✅ No significant performance changes\n\n';
              }
            } else {
              comment += '### ℹ️ No baseline for comparison\n\n';
              comment += 'This is the first performance run for this branch.\n\n';
            }

            comment += '---\n';
            comment += '*View detailed dashboard in artifacts*\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on critical regressions
        if: always()
        run: |
          if [ -f .performance-history/regression-detected ]; then
            echo "Critical performance regressions detected!"
            exit 1
          fi

  # ── MCP compliance (always, no live API needed) ───────────────────────────────
  compliance-tests:
    name: MCP Compliance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run compliance tests
        run: npm run test:compliance

  # ── Detect whether live benchmark secrets are configured ───────────────────────
  live-test-prereqs:
    name: Live Benchmark Prerequisites
    runs-on: ubuntu-latest
    outputs:
      benchmark_credentials_ready: ${{ steps.check.outputs.benchmark_credentials_ready }}
      live_api_ready: ${{ steps.check.outputs.live_api_ready }}

    steps:
      - name: Check configured secrets
        id: check
        env:
          GOOGLE_TEST_CREDENTIALS: ${{ secrets.GOOGLE_TEST_CREDENTIALS }}
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}
        run: |
          benchmark_credentials_ready=false
          live_api_ready=false

          if [ -n "$GOOGLE_TEST_CREDENTIALS" ]; then
            benchmark_credentials_ready=true
          fi

          if [ -n "$GOOGLE_TEST_CREDENTIALS" ] && [ -n "$TEST_SPREADSHEET_ID" ]; then
            live_api_ready=true
          fi

          echo "benchmark_credentials_ready=$benchmark_credentials_ready" >> "$GITHUB_OUTPUT"
          echo "live_api_ready=$live_api_ready" >> "$GITHUB_OUTPUT"

  # ── Live API tool benchmarks (conditional on GOOGLE_TEST_CREDENTIALS) ─────────
  tool-benchmarks:
    name: Tool-Level Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compliance-tests, live-test-prereqs]
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      ) &&
      needs.live-test-prereqs.outputs.benchmark_credentials_ready == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Setup test credentials
        env:
          GOOGLE_TEST_CREDENTIALS: ${{ secrets.GOOGLE_TEST_CREDENTIALS }}
        run: |
          mkdir -p tests/config
          printf '%s' "$GOOGLE_TEST_CREDENTIALS" > tests/config/test-credentials.json

      - name: Download baseline benchmarks
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: benchmarks/baseline.json
          key: benchmark-baseline-${{ github.base_ref || github.ref_name }}
          restore-keys: |
            benchmark-baseline-main
            benchmark-baseline-

      - name: Run tool-level benchmarks
        if: |
          github.event.inputs.benchmark_type == 'tool-level' ||
          github.event.inputs.benchmark_type == 'full' ||
          github.event_name == 'push'
        env:
          TEST_REAL_API: 'true'
          RUN_BENCHMARKS: 'true'
          GOOGLE_TEST_CREDENTIALS_PATH: tests/config/test-credentials.json
          GOOGLE_APPLICATION_CREDENTIALS: tests/config/test-credentials.json
        run: npm run bench:tool-level

      - name: Track benchmark results & detect regressions
        run: npm run benchmarks:track
        continue-on-error: true
        id: benchmark-tracking
        env:
          BENCHMARK_THRESHOLD: '10'

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-tool-level
          path: |
            benchmark-results/
            benchmarks/latest.json
            benchmarks/history/
            benchmark-report.json
            benchmark-report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Update baseline (on main branch)
        if: github.ref == 'refs/heads/main' && steps.benchmark-tracking.outcome == 'success'
        run: |
          mkdir -p benchmarks
          cp benchmarks/latest.json benchmarks/baseline.json
          echo "✅ Baseline updated for main branch"

  # ── Action-level benchmarks (manual trigger only — expensive) ─────────────────
  action-benchmarks:
    name: Action-Level Benchmarks
    runs-on: ubuntu-latest
    needs: [tool-benchmarks, live-test-prereqs]
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.live-test-prereqs.outputs.benchmark_credentials_ready == 'true' &&
      (github.event.inputs.benchmark_type == 'action-level' ||
       github.event.inputs.benchmark_type == 'full')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Setup test credentials
        env:
          GOOGLE_TEST_CREDENTIALS: ${{ secrets.GOOGLE_TEST_CREDENTIALS }}
        run: |
          mkdir -p tests/config
          printf '%s' "$GOOGLE_TEST_CREDENTIALS" > tests/config/test-credentials.json

      - name: Run action-level benchmarks
        env:
          TEST_REAL_API: 'true'
          RUN_BENCHMARKS: 'true'
          GOOGLE_TEST_CREDENTIALS_PATH: tests/config/test-credentials.json
          GOOGLE_APPLICATION_CREDENTIALS: tests/config/test-credentials.json
        run: npm run bench:action-level
        timeout-minutes: 30

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-action-level
          path: |
            benchmark-results/
            benchmark-report.json
            benchmark-report.md
          retention-days: 30
          if-no-files-found: ignore

  # ── Optimization layer verification (manual trigger only) ─────────────────────
  optimization-tests:
    name: Optimization Layer Tests
    runs-on: ubuntu-latest
    needs: [compliance-tests, live-test-prereqs]
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.live-test-prereqs.outputs.benchmark_credentials_ready == 'true' &&
      (github.event.inputs.benchmark_type == 'optimizations' ||
       github.event.inputs.benchmark_type == 'full')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Setup test credentials
        env:
          GOOGLE_TEST_CREDENTIALS: ${{ secrets.GOOGLE_TEST_CREDENTIALS }}
        run: |
          mkdir -p tests/config
          printf '%s' "$GOOGLE_TEST_CREDENTIALS" > tests/config/test-credentials.json

      - name: Run optimization layer tests
        env:
          TEST_REAL_API: 'true'
          GOOGLE_TEST_CREDENTIALS_PATH: tests/config/test-credentials.json
          GOOGLE_APPLICATION_CREDENTIALS: tests/config/test-credentials.json
        run: npm run bench:optimizations

      - name: Upload optimization results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optimization-test-results
          path: |
            optimization-results/
          retention-days: 30
          if-no-files-found: ignore

  # ── Live API tests (core + data tools) ───────────────────────────────────────
  live-api-tests:
    name: Live API Tests
    runs-on: ubuntu-latest
    needs: [compliance-tests, live-test-prereqs]
    if: |
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.include_live_tests == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      ) &&
      needs.live-test-prereqs.outputs.live_api_ready == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Setup test credentials
        env:
          GOOGLE_TEST_CREDENTIALS: ${{ secrets.GOOGLE_TEST_CREDENTIALS }}
        run: |
          mkdir -p tests/config
          printf '%s' "$GOOGLE_TEST_CREDENTIALS" > tests/config/test-credentials.json

      - name: Run live API tests (core + data subset)
        env:
          TEST_REAL_API: 'true'
          GOOGLE_TEST_CREDENTIALS_PATH: tests/config/test-credentials.json
          GOOGLE_APPLICATION_CREDENTIALS: tests/config/test-credentials.json
          TEST_SPREADSHEET_ID: ${{ secrets.TEST_SPREADSHEET_ID }}
        run: >-
          npx vitest run --config tests/config/vitest.config.live.ts
          tests/live-api/tools/sheets-core.live.test.ts
          tests/live-api/tools/sheets-data.live.test.ts

  # ── Update baseline cache on main ─────────────────────────────────────────────
  update-baseline-main:
    name: Update Baseline (main)
    runs-on: ubuntu-latest
    needs: performance-regression-tests
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.performance-regression-tests.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download performance results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        id: download-perf
        with:
          name: performance-results
          path: .performance-history/

      - name: Initialize baseline if first run
        if: steps.download-perf.outcome == 'failure'
        run: |
          mkdir -p .performance-history
          echo '{"initialized": true, "created": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > .performance-history/baseline.json
          echo "No previous performance baseline found — initializing empty baseline"

      - name: Update baseline cache
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .performance-history/
          key: performance-baseline-main-${{ github.sha }}

  # ── Publish dashboard to GitHub Pages ────────────────────────────────────────
  publish-dashboard:
    name: Publish Dashboard
    runs-on: ubuntu-latest
    needs: performance-regression-tests
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.performance-regression-tests.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download dashboard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: performance-dashboard
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          destination_dir: performance
          keep_files: false
          commit_message: 'Update performance dashboard'

  # ── Summary (always) ──────────────────────────────────────────────────────────
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - performance-regression-tests
      - compliance-tests
      - live-test-prereqs
      - tool-benchmarks
      - action-benchmarks
      - optimization-tests
      - live-api-tests
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-results
        continue-on-error: true

      - name: Summarize results
        run: |
          echo "## Performance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.performance-regression-tests.result }}" == "success" ]; then
            echo "- ✅ Performance Regression Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Performance Regression Tests: ${{ needs.performance-regression-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.compliance-tests.result }}" == "success" ]; then
            echo "- ✅ MCP Compliance Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ MCP Compliance Tests: ${{ needs.compliance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.live-test-prereqs.outputs.benchmark_credentials_ready }}" == "true" ]; then
            echo "- ✅ Benchmark credentials: Configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Benchmark credentials: Missing GOOGLE_TEST_CREDENTIALS" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.tool-benchmarks.result }}" == "success" ]; then
            echo "- ✅ Tool-Level Benchmarks: Completed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.tool-benchmarks.result }}" == "skipped" ]; then
            echo "- ⏭️ Tool-Level Benchmarks: Skipped (no credentials)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Tool-Level Benchmarks: ${{ needs.tool-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.action-benchmarks.result }}" == "success" ]; then
            echo "- ✅ Action-Level Benchmarks: Completed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.action-benchmarks.result }}" == "skipped" ]; then
            echo "- ⏭️ Action-Level Benchmarks: Skipped (manual trigger only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Action-Level Benchmarks: ${{ needs.action-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.optimization-tests.result }}" == "success" ]; then
            echo "- ✅ Optimization Layer Tests: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.optimization-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ Optimization Layer Tests: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Optimization Layer Tests: ${{ needs.optimization-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.live-api-tests.result }}" == "success" ]; then
            echo "- ✅ Live API Tests: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.live-api-tests.result }}" == "skipped" ]; then
            echo "- ⏭️ Live API Tests: Skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Live API Tests: ${{ needs.live-api-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed benchmark and regression results." >> $GITHUB_STEP_SUMMARY
